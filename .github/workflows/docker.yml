name: Publish Docker image

on:
  release:
    types: [published]
  push:
    branches:
      - master
      - develop

jobs:
  PushDockerImage:
    if: github.repository == 'CollaborativeStateMachines/Cirrina-CSML-SmartFactory'
    name: Push Docker Image - ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    strategy:
      matrix:
        include:
          - name: Smart Factory Service
            context: benchmark-s1/smart-factory-service
            image: collaborativestatemachines/smartfactoryservice

          - name: Metrics Collector
            context: benchmark-s1/metrics-collector
            image: collaborativestatemachines/smartfactorycollector

          - name: Event Publisher
            context: benchmark-s1/event-publisher
            image: collaborativestatemachines/smartfactoryep
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=raw,value=stable,enable=${{ github.event_name == 'release' }}

            type=raw,value=nightly,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,enable=${{ github.ref == 'refs/heads/master' }}

            type=raw,value=unstable,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,enable=${{ github.ref == 'refs/heads/develop' }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}